# render.yaml — Render Blueprint (Infrastructure as Code)
# Deploy the whole stack (PostgreSQL + web service) in one click via
# Render Dashboard -> New + -> Blueprint, pointed at this repo.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: revoshop-db
    plan: free
    region: singapore
    # databaseName/user are auto-generated by Render.

services:
  - type: web
    name: revoshop-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    # Install deps, then run DB migrations on every deploy so the schema
    # is always up to date before the app starts serving requests.
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn run:app"
    healthCheckPath: /
    envVars:
      # Pull the connection string straight from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: revoshop-db
          property: connectionString
      # Flask needs to know the app entry point for `flask db upgrade`.
      - key: FLASK_APP
        value: app.py
      - key: FLASK_DEBUG
        value: "False"
      - key: JWT_EXPIRES_HOURS
        value: "24"
      # Secrets are generated once by Render and kept stable across deploys.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
