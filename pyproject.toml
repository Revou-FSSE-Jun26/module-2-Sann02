[project]
name = "revoshop-backend"
version = "1.0.0"
description = "RevoShop REST API (Flask) — Module 2"
requires-python = ">=3.12,<3.13"

# Runtime dependencies only (what the API needs to serve requests).
# Dev/test tools (pytest, locust) live in [dependency-groups.dev] below so
# Vercel's `uv sync --no-dev` skips them and keeps the function bundle small.
dependencies = [
    "Flask==3.1.3",
    "flasgger==0.9.7.1",
    "flask-cors==6.0.5",
    "Flask-Migrate==4.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "PyJWT==2.11.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "locust==2.46.3",
]

# Tell Vercel which WSGI callable to serve: the `app` object in app.py.
[tool.vercel]
entrypoint = "app:app"

[tool.setuptools]
# This is an application, not an installable package — don't try to
# auto-discover importable packages (avoids build errors on Vercel).
py-modules = []
